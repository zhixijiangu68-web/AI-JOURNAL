<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0c"><title>AI Journal</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div class="logo">JOURNAL</div><div id="today" class="date"></div></header><section class="hero"><p class="eyebrow">A QUIET PLACE FOR YOUR THOUGHTS</p><h1>今日は、<br>どんな一日でしたか。</h1><p class="lead">うまく書こうとしなくて大丈夫です。今考えていることを、そのまま残してください。</p></section><section class="writer"><textarea id="journal" placeholder="今日あったこと、感じたこと、考えていること..."></textarea><div class="meta"><span>あなたのための日記</span><span><b id="count">0</b>文字</span></div><button id="reflectBtn">今日を振り返る</button></section><section id="reflection" class="reflection hidden"><p class="eyebrow">REFLECTION</p><h2>今日の振り返り</h2><p id="summary" class="summary"></p><div class="insight"><span>TODAY'S INSIGHT</span><p id="insight"></p></div><div class="question"><span>QUESTION FOR YOU</span><p id="question"></p></div><button id="saveBtn" class="secondary">この日を記憶する</button></section><section class="history"><div class="section-head"><p class="eyebrow">MEMORY</p><h2>過去の記憶</h2></div><div id="history"></div></section></main><script src="app.js"></script></body></html>
