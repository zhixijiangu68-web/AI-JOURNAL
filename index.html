<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090a"><title>AI Journal</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div class="logo">JOURNAL</div><div id="today" class="date"></div></header><section class="hero"><p class="eyebrow">A QUIET PLACE FOR YOUR THOUGHTS</p><h1>今日は、<br>どんな一日でしたか。</h1><p class="lead">正しく書く必要はありません。今日の出来事、気持ち、まだ言葉にならないことまで、そのまま残してください。</p></section><section class="writer"><textarea id="journal" placeholder="今日あったこと、感じたこと、考えていること..."></textarea><div class="meta"><span>あなたのための日記</span><span><b id="count">0</b>文字</span></div><button id="reflectBtn">今日を振り返る <span>→</span></button></section><section id="reflection" class="reflection hidden"><div class="reflectionTop"><p class="eyebrow">AI REFLECTION</p><p id="emotion" class="emotion"></p></div><h2>今日という一日を、<br>少し離れて見てみる。</h2><p id="summary" class="summary"></p><div class="analysisGrid"><article class="analysisCard"><span>01 / 気づき</span><h3>自分では見落としていたこと</h3><p id="insight"></p></article><article class="analysisCard"><span>02 / 深掘り</span><h3>もう少し考えてみたいこと</h3><p id="question"></p></article><article class="analysisCard tomorrow"><span>03 / TOMORROW</span><h3>明日の自分へ</h3><p id="tomorrow"></p></article></div><button id="saveBtn" class="secondary">この日を記憶する</button></section><section class="history"><div class="sectionHead"><p class="eyebrow">YOUR MEMORY</p><h2>過去の記憶</h2><p>書き続けるほど、自分の変化が見えてきます。</p></div><div id="history"></div></section></main><script src="app.js"></script></body></html>
